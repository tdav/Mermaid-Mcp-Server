# deploy/nginx.conf — реверс-прокси для mermaid-mcp.service (слушает 127.0.0.1:40100).
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mermaid-mcp
#   sudo sed -i 's/mermaid.example.com/<ваш домен>/' /etc/nginx/sites-available/mermaid-mcp
#   sudo ln -sf /etc/nginx/sites-available/mermaid-mcp /etc/nginx/sites-enabled/mermaid-mcp
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <ваш домен>          # TLS; PUBLIC_BASE_URL тогда https://...
#
# Наружу открыты: /mcp (MCP, Streamable HTTP), /files/ (файлы generate_mermaid_file) и веб-UI.

server {
    listen 80;
    server_name mermaid.example.com;

    # MCP: ответ на запрос может идти SSE-потоком (уведомления, затем результат) —
    # буферизация nginx задержала бы его до конца.
    location = /mcp {
        proxy_pass http://127.0.0.1:40100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Файлы генерации: GUID в имени не меняется, nginx пропускает Cache-Control сервиса как есть.
    location /files/ {
        proxy_pass http://127.0.0.1:40100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Веб-UI, /render, /examples.
    location / {
        proxy_pass http://127.0.0.1:40100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
